name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore Trdo.slnx
      
    - name: Build
      run: dotnet build Trdo.slnx --configuration Release --no-restore /p:PublishReadyToRun=false /p:Platform=x64

    - name: Test
      run: dotnet test Trdo.Tests/Trdo.Tests.csproj --configuration Release --no-build /p:Platform=x64
